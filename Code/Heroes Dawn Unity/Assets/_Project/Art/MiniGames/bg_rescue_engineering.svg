<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3B46"/><stop offset="1" stop-color="#181F26"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#5FD0FF" stroke-opacity="0.09" stroke-width="2"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <!-- étagères d'abri -->
  <g fill="#0E1318" stroke="#3B4B5A" stroke-width="4"><rect x="0" y="120" width="1280" height="10"/><rect x="0" y="300" width="1280" height="10"/></g>
  <!-- boîtes de pièces -->
  <g fill="#4C6275" stroke="#1B2630" stroke-width="3"><rect x="40" y="60" width="90" height="60"/><rect x="150" y="80" width="70" height="40"/><rect x="1060" y="56" width="110" height="64"/><rect x="1180" y="84" width="70" height="36"/><rect x="60" y="240" width="80" height="60"/><rect x="1120" y="236" width="100" height="64"/></g>
  <!-- néons -->
  <g fill="#5FD0FF" fill-opacity="0.8"><rect x="320" y="16" width="260" height="10" rx="5"/><rect x="700" y="16" width="260" height="10" rx="5"/></g>
  <g fill="#5FD0FF" fill-opacity="0.08"><polygon points="320,26 580,26 640,260 260,260"/><polygon points="700,26 960,26 1020,260 640,260"/></g>
  <!-- plan technique -->
  <g stroke="#FFD24D" stroke-opacity="0.35" stroke-width="3" fill="none" stroke-dasharray="10 8"><rect x="360" y="380" width="560" height="190" rx="12"/><path d="M360 380 L920 570"/><path d="M920 380 L360 570"/></g>
  <circle cx="640" cy="475" r="28" fill="none" stroke="#FFD24D" stroke-opacity="0.35" stroke-width="3"/>
</svg>
