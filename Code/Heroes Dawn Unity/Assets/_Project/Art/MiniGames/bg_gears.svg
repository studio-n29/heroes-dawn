<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2E22"/><stop offset="1" stop-color="#1B1510"/></linearGradient>
    <pattern id="planks" width="160" height="64" patternUnits="userSpaceOnUse"><rect width="160" height="64" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#planks)"/>
  <!-- grands pignons décoratifs -->
  <g fill="#6A5640" fill-opacity="0.35" stroke="#6A5640" stroke-opacity="0.6" stroke-width="6">
    <circle cx="90" cy="110" r="92"/><circle cx="1210" cy="540" r="110"/><circle cx="1190" cy="90" r="64"/><circle cx="80" cy="560" r="58"/>
  </g>
  <g stroke="#6A5640" stroke-opacity="0.7" stroke-width="16" stroke-dasharray="14 18" fill="none">
    <circle cx="90" cy="110" r="100"/><circle cx="1210" cy="540" r="120"/><circle cx="1190" cy="90" r="72"/><circle cx="80" cy="560" r="66"/>
  </g>
  <!-- établi -->
  <rect x="0" y="590" width="1280" height="50" fill="#120E0A"/>
  <g fill="#8A7A5A"><rect x="260" y="572" width="120" height="14" rx="4"/><rect x="900" y="566" width="70" height="20" rx="4"/></g>
  <g fill="#C9B77E"><circle cx="980" cy="578" r="9"/><circle cx="1010" cy="578" r="9"/></g>
  <!-- outils accrochés -->
  <g stroke="#B9A77A" stroke-width="10" stroke-linecap="round"><path d="M640 20 L640 90"/><path d="M700 24 L730 90"/><path d="M580 24 L550 90"/></g>
  <!-- étincelles -->
  <g fill="#FFC857" fill-opacity="0.5"><circle cx="420" cy="540" r="4"/><circle cx="440" cy="520" r="3"/><circle cx="800" cy="545" r="4"/></g>
</svg>
