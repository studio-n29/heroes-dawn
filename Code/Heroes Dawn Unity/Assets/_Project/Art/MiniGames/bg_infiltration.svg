<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C3B2E"/><stop offset="1" stop-color="#151E1A"/></linearGradient>
    <pattern id="dirt" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="2" fill="#000" fill-opacity="0.18"/><circle cx="30" cy="34" r="3" fill="#000" fill-opacity="0.14"/><circle cx="40" cy="12" r="2" fill="#fff" fill-opacity="0.05"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dirt)"/>
  <!-- chemins -->
  <g stroke="#3C4A3B" stroke-width="46" stroke-linecap="round" fill="none" stroke-opacity="0.6"><path d="M0 320 L1280 320"/><path d="M420 80 L420 560"/><path d="M880 100 L880 540"/></g>
  <!-- tentes -->
  <g fill="#4A5A44" stroke="#0E1410" stroke-width="4"><polygon points="170,130 250,60 330,130 330,190 170,190"/><polygon points="760,470 840,400 920,470 920,530 760,530"/><polygon points="1010,150 1090,80 1170,150 1170,210 1010,210"/></g>
  <g fill="#1E2A1F"><rect x="236" y="140" width="28" height="50"/><rect x="826" y="480" width="28" height="50"/><rect x="1076" y="160" width="28" height="50"/></g>
  <!-- caisses -->
  <g fill="#6B5A3A" stroke="#241C10" stroke-width="3"><rect x="560" y="140" width="60" height="60"/><rect x="624" y="170" width="44" height="44"/><rect x="120" y="440" width="64" height="64"/></g>
  <!-- projecteurs -->
  <g fill="#FFE9A0" fill-opacity="0.07"><polygon points="100,30 -40,320 240,320"/><polygon points="1180,20 1030,300 1330,300"/></g>
  <g fill="#FFE9A0"><circle cx="100" cy="26" r="9"/><circle cx="1180" cy="16" r="9"/></g>
  <!-- barbelés -->
  <g stroke="#9AA39A" stroke-width="3" fill="none" stroke-opacity="0.6"><path d="M0 8 L1280 8"/><path d="M0 632 L1280 632"/></g>
</svg>
